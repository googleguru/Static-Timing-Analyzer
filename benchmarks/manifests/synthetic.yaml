# Synthetic benchmark manifest — always available, no external files required.
# These benchmarks use a hand-crafted Liberty + generated Verilog netlists.
# Copyright (c) 2024 sta-choa project (MIT License)

benchmarks:

  - name: simple_design
    family: synthetic
    liberty: benchmarks/synthetic/simple.lib
    verilog: benchmarks/synthetic/simple_design.v
    sdc:     benchmarks/synthetic/simple.sdc
    spef:    benchmarks/synthetic/simple.spef
    sdf:     ~
    top_module: simple_design
    clock_period_ns: 10.0
    enabled: true

  - name: synth_small
    family: synthetic
    liberty: benchmarks/synthetic/simple.lib
    verilog: benchmarks/synthetic/synth_small.v
    sdc:     benchmarks/synthetic/synth_small.sdc

# ISCAS-85 combinational benchmark manifest.
#
# ISCAS-85 circuits are publicly available benchmark circuits introduced in:
#   F. Brglez, H. Fujiwara, "A Neutral Netlist of 10 Combinational Benchmark
#   Circuits and a Target Translator in Fortran", ISCAS 1985.
#
# Timing-ready collateral (Liberty-mapped gate-level Verilog + SDC) must be
# prepared separately from public sources (e.g., opencores, verilog-iscas, or
# academic EDA repositories).
#
# ASSUMPTION: Files placed under benchmarks/iscas85/<circuit>/
# STATUS: Files NOT included — benchmarks will be SKIPPED until placed here.
# See benchmarks/README.md for download and preparation instructions.

benchmarks:

  - name: c17
    family: iscas85
    liberty: benchmarks/iscas85/c17/tech.lib
    verilog: benchmarks/iscas85/c17/c17.v
    sdc:     benchmarks/iscas85/c17/c17.sdc
    spef:    ~
    sdf:     ~
    top_module: c17
    clock_period_ns: 10.0
    enabled: true


# ISCAS-89 sequential benchmark manifest.
#
# ISCAS-89 sequential circuits introduced in:
#   F. Brglez, D. Bryan, K. Kozminski, "Combinational Profiles of Sequential
#   Benchmark Circuits", ISCAS 1989.
#
# Timing-ready gate-level Verilog mapped to a Liberty library is required.
# STATUS: Files NOT included — benchmarks will be SKIPPED until placed here.
# See benchmarks/README.md for preparation instructions.

benchmarks:

  - name: s27
    family: iscas89
    liberty: benchmarks/iscas89/s27/tech.lib
    verilog: benchmarks/iscas89/s27/s27.v
    sdc:     benchmarks/iscas89/s27/s27.sdc
    spef:    ~
    sdf:     ~
    top_module: s27
    clock_period_ns: 10.0
    enabled: true

